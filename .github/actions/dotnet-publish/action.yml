name: .NET Publish
description: Publish a native AOT binary for a target RID, package it, and upload as a workflow artifact

inputs:
  rid:
    description: Target runtime identifier (win-x64 | linux-x64 | osx-x64 | osx-arm64)
    required: true
  version:
    description: Version string without the v prefix (e.g. 1.2.3)
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: '10.x'

    # Native AOT on Windows needs MSVC cl.exe/link.exe in PATH.
    # ilammy/msvc-dev-cmd activates the VS developer environment.
    - name: Setup MSVC developer environment (Windows)
      if: ${{ runner.os == 'Windows' }}
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install native AOT prerequisites (Linux)
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: sudo apt-get install -y clang zlib1g-dev

    - name: Publish
      shell: bash
      run: |
        dotnet publish src/Cli \
          -r ${{ inputs.rid }} \
          -c Release \
          -o dist/${{ inputs.rid }} \
          -p:Version=${{ inputs.version }}

    - name: Package
      shell: bash
      run: |
        RID="${{ inputs.rid }}"
        VERSION="${{ inputs.version }}"
        if [[ "$RID" == win-* ]]; then
          7z a "symplr-${VERSION}-${RID}.zip" "./dist/${RID}/symplr.exe"
        else
          tar czf "symplr-${VERSION}-${RID}.tar.gz" -C "dist/${RID}" symplr
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: symplr-${{ inputs.rid }}
        path: symplr-${{ inputs.version }}-${{ inputs.rid }}.*
        if-no-files-found: error
